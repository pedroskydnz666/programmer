name: Ubuntu-SSH-Tailscale

"on":
  workflow_dispatch:

concurrency:
  group: ubuntu-ssh
  cancel-in-progress: false

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Sanity check
        shell: bash
        run: |
          set -e
          uname -a
          cat /etc/os-release

      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.TAILSCALE_AUTH_KEY }}" ]; then
            echo "ERRO: Secret TAILSCALE_AUTH_KEY ausente/vazio."
            exit 1
          fi
          echo "OK: TAILSCALE_AUTH_KEY presente."

      - name: Install dependencies + Create SSH user
        shell: bash
        run: |
          set -euo pipefail

          USER="sshuser"

          if [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
            PASS="${{ secrets.SSH_PASSWORD }}"
          else
            PASS="$(python3 -c 'import secrets,string; a=string.ascii_letters+string.digits+"@#$%^&*()_+=-{}[]:;,.?"; print("".join(secrets.choice(a) for _ in range(28)))')"
          fi

          sudo apt-get update -qq
          sudo apt-get install -y openssh-server ufw curl jq netcat-openbsd tmate

          sudo useradd -m -s /bin/bash "$USER" || true
          echo "$USER:$PASS" | sudo chpasswd
          sudo usermod -aG sudo "$USER" || true

          printf 'PasswordAuthentication yes\nKbdInteractiveAuthentication yes\nUsePAM yes\nPermitRootLogin no\n' | sudo tee /etc/ssh/sshd_config.d/99-gh-actions.conf >/dev/null

          sudo systemctl enable --now ssh || true
          sudo systemctl restart ssh || true

          sudo ufw allow 22/tcp || true
          sudo ufw --force enable || true
          sudo ufw allow in on tailscale0 to any port 22 proto tcp || true
          sudo ufw reload || true

          {
            echo "SSH_USER=$USER"
            echo "SSH_PASS=$PASS"
          } >> "$GITHUB_ENV"

      - name: Install Tailscale
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled

      - name: Bring up Tailscale
        shell: bash
        run: |
          set -euo pipefail

          TS_AUTHKEY="$(printf '%s' "${{ secrets.TAILSCALE_AUTH_KEY }}" | tr -d '\r\n')"
          TS_TAG="$(printf '%s' "${{ secrets.TAILSCALE_TAG }}" | tr -d '\r\n')"

          if [ -n "$TS_TAG" ]; then
            sudo tailscale up \
              --reset \
              --authkey="$TS_AUTHKEY" \
              --hostname="gh-ubuntu-${{ github.run_id }}" \
              --accept-dns=false \
              --ssh \
              --advertise-tags="$TS_TAG"
          else
            sudo tailscale up \
              --reset \
              --authkey="$TS_AUTHKEY" \
              --hostname="gh-ubuntu-${{ github.run_id }}" \
              --accept-dns=false \
              --ssh
          fi

          for i in {1..40}; do
            if tailscale status --json 2>/dev/null | jq -e '.Self.Online == true' >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! tailscale status --json 2>/dev/null | jq -e '.Self.Online == true' >/dev/null; then
            echo "ERRO: No Tailscale nao ficou Online."
            tailscale status || true
            exit 1
          fi

          TSIP="$(tailscale ip -4 2>/dev/null | head -n1 || true)"
          if [ -z "$TSIP" ]; then
            echo "ERRO: Tailscale online mas sem IPv4 atribuido."
            exit 1
          fi

          echo "TAILSCALE_IP=$TSIP" >> "$GITHUB_ENV"

      - name: Start tmate + Keep alive
        shell: bash
        run: |
          set +e

          # Inicia tmate em sessão própria (setsid = processo independente do shell)
          # Assim ele NÃO morre quando o runner recebe SIGTERM
          setsid tmate -S /tmp/tmate.sock new-session -d -s main 2>/dev/null
          sleep 2

          # Aguarda tmate conectar ao servidor
          for i in {1..30}; do
            tmate -S /tmp/tmate.sock wait tmate-ready 2>/dev/null && break
            sleep 2
          done

          # Captura as URLs
          TMATE_SSH="$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null)"
          TMATE_WEB="$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}' 2>/dev/null)"
          TMATE_SSH_RO="$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh_ro}' 2>/dev/null)"
          TMATE_WEB_RO="$(tmate -S /tmp/tmate.sock display -p '#{tmate_web_ro}' 2>/dev/null)"

          echo ""
          echo "========================================="
          echo "          TMATE ACCESS INFO"
          echo "========================================="
          echo "SSH  (rw): $TMATE_SSH"
          echo "Web  (rw): $TMATE_WEB"
          echo "SSH  (ro): $TMATE_SSH_RO"
          echo "Web  (ro): $TMATE_WEB_RO"
          echo "========================================="
          echo "Tailscale SSH:"
          echo "  ssh $SSH_USER@$TAILSCALE_IP"
          echo "  Senha: $SSH_PASS"
          echo "========================================="
          echo ""

          # Keep alive — encerra limpo no SIGTERM
          trap 'echo "[$(date)] Encerrado."; exit 0' SIGTERM SIGINT

          while true; do
            sleep 60 & wait $!
            echo "[$(date)] Alive | tmate: $TMATE_SSH | TS: $TAILSCALE_IP"
          done
