name: Ubuntu-SSH-Tailscale

"on":
  workflow_dispatch:

concurrency:
  group: ubuntu-ssh
  cancel-in-progress: true

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Sanity check
        shell: bash
        run: |
          set -e
          uname -a
          cat /etc/os-release

      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.TAILSCALE_AUTH_KEY }}" ]; then
            echo "ERRO: Secret TAILSCALE_AUTH_KEY ausente/vazio."
            exit 1
          fi
          echo "OK: TAILSCALE_AUTH_KEY presente."

      - name: Install OpenSSH + Create SSH user
        shell: bash
        run: |
          set -euo pipefail

          USER="sshuser"

          if [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
            PASS="${{ secrets.SSH_PASSWORD }}"
          else
            PASS="$(python3 -c 'import secrets,string; a=string.ascii_letters+string.digits+"@#$%^&*()_+=-{}[]:;,.?"; print("".join(secrets.choice(a) for _ in range(28)))')"
          fi

          sudo apt-get update
          sudo apt-get install -y openssh-server ufw curl jq netcat-openbsd

          sudo useradd -m -s /bin/bash "$USER" || true
          echo "$USER:$PASS" | sudo chpasswd
          sudo usermod -aG sudo "$USER" || true

          printf 'PasswordAuthentication yes\nKbdInteractiveAuthentication yes\nUsePAM yes\nPermitRootLogin no\n' | sudo tee /etc/ssh/sshd_config.d/99-gh-actions.conf >/dev/null

          sudo systemctl enable --now ssh || true
          sudo systemctl restart ssh || true

          sudo ufw allow 22/tcp || true
          sudo ufw --force enable || true
          sudo ufw allow in on tailscale0 to any port 22 proto tcp || true
          sudo ufw reload || true

          {
            echo "SSH_USER=$USER"
            echo "SSH_PASS=$PASS"
          } >> "$GITHUB_ENV"

      - name: Install Tailscale
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled
          sudo tailscale version || true

      - name: Bring up Tailscale
        shell: bash
        run: |
          set -euo pipefail

          TS_AUTHKEY="$(printf '%s' "${{ secrets.TAILSCALE_AUTH_KEY }}" | tr -d '\r\n')"
          TS_TAG="$(printf '%s' "${{ secrets.TAILSCALE_TAG }}" | tr -d '\r\n')"

          if [ -n "$TS_TAG" ]; then
            sudo tailscale up \
              --reset \
              --authkey="$TS_AUTHKEY" \
              --hostname="gh-ubuntu-${{ github.run_id }}" \
              --accept-dns=false \
              --ssh \
              --advertise-tags="$TS_TAG"
          else
            sudo tailscale up \
              --reset \
              --authkey="$TS_AUTHKEY" \
              --hostname="gh-ubuntu-${{ github.run_id }}" \
              --accept-dns=false \
              --ssh
          fi

          for i in {1..40}; do
            if tailscale status --json 2>/dev/null | jq -e '.Self.Online == true' >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! tailscale status --json 2>/dev/null | jq -e '.Self.Online == true' >/dev/null; then
            echo "ERRO: No Tailscale nao ficou Online."
            tailscale status || true
            exit 1
          fi

          TSIP="$(tailscale ip -4 2>/dev/null | head -n1 || true)"
          if [ -z "$TSIP" ]; then
            echo "ERRO: Tailscale online mas sem IPv4 atribuido."
            exit 1
          fi

          echo "TAILSCALE_IP=$TSIP" >> "$GITHUB_ENV"

      - name: Show SSH access info
        shell: bash
        run: |
          echo ""
          echo "========================================="
          echo "           SSH ACCESS INFO"
          echo "========================================="
          echo "Host: $TAILSCALE_IP"
          echo "User: $SSH_USER"
          echo "Pass: $SSH_PASS"
          echo "Cmd:  ssh $SSH_USER@$TAILSCALE_IP"
          echo "========================================="

      - name: Install tmate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y tmate
          tmate -V

      - name: Start tmate + Show URLs + Keep alive
        shell: bash
        run: |
          set +e

          # Inicia tmate com socket nomeado (funciona sem TTY no CI)
          tmate -S /tmp/tmate.sock new-session -d -s main

          # Aguarda o tmate conectar ao servidor e estar pronto
          tmate -S /tmp/tmate.sock wait tmate-ready

          # Captura as URLs
          TMATE_SSH="$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')"
          TMATE_WEB="$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')"
          TMATE_SSH_RO="$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh_ro}')"
          TMATE_WEB_RO="$(tmate -S /tmp/tmate.sock display -p '#{tmate_web_ro}')"

          echo ""
          echo "========================================="
          echo "          TMATE ACCESS INFO"
          echo "========================================="
          echo "SSH  (rw): $TMATE_SSH"
          echo "Web  (rw): $TMATE_WEB"
          echo "SSH  (ro): $TMATE_SSH_RO"
          echo "Web  (ro): $TMATE_WEB_RO"
          echo "========================================="
          echo ""
          echo "SSH direto (Tailscale):"
          echo "  ssh $SSH_USER@$TAILSCALE_IP"
          echo "  Senha: $SSH_PASS"
          echo "========================================="
          echo ""

          # Mantém o runner vivo e repete as URLs a cada minuto
          while true; do
            sleep 60
            echo "[$(date)] Alive"
            echo "  tmate SSH : $TMATE_SSH"
            echo "  tmate Web : $TMATE_WEB"
            echo "  TS SSH    : ssh $SSH_USER@$TAILSCALE_IP"
          done
